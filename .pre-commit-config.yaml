repos:
  # 1. Core pre-commit utilities - basic checks and file formatting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      # Security checks
      - id: detect-private-key

      # File format validation
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: ['--maxkb=102400']  # GitHub's 100MB limit

      # File formatting
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending

  # 2. Code linting, formatting, and type checking
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 45ef068da5f21267bb2a7ec4a623092959f09ce5 # v0.14.14
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: fc0f09a29bb495f4a91f00266155d6282d52485d # v1.20.2
    hooks:
      - id: mypy
        files: ^src/.*\.py$
        additional_dependencies: ["curl-cffi==0.15.0"]

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: d252a2a7678b47d1f2eea2f6b846ddfdcd012759 # v2.11.1
    hooks:
      - id: pyproject-fmt

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 7339935a3036f096ee0d7f1f047a9ec41707d4c1 # v0.20.0
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
        entry: gitleaks dir --redact --verbose .
