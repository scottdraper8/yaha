name: Analyze Host Lists

on:
  schedule:
    # Weekly on Sunday at 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions: read-all

concurrency:
  group: host-list-analysis
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze with read-only credentials
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check out repository without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          python-version: "3.11.15"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install project from lockfile
        run: uv sync --locked --no-dev

      - name: Run host-list analysis
        run: uv run --frozen --no-dev yaha --force

      - name: Validate generated state
        run: |
          jq -e '
            type == "object" and
            (.sources | type == "object") and
            (.analysis_count | type == "number") and
            (.skipped_analyses | type == "number") and
            (.last_analysis | type == "string")
          ' state.json >/dev/null
          test "$(grep -c '<!-- STATS_START -->' README.md)" -eq 1
          test "$(grep -c '<!-- STATS_END -->' README.md)" -eq 1
          test "$(stat -c '%s' README.md)" -le 1048576
          test "$(stat -c '%s' state.json)" -le 10485760

      - name: Upload generated files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-list-analysis
          path: |
            README.md
            state.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1

      - name: Generate workflow summary
        if: always()
        run: |
          echo "## YAHA Host-List Analysis" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Configured sources | $(jq 'length' blocklists.json) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Completed analyses | $(jq -r '.analysis_count' state.json) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Removal candidates | $(jq '[.sources[].metadata.removal_candidate | select(. == true)] | length' state.json) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Last analysis | $(jq -r '.last_analysis' state.json) |" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish through a pull request
    needs: analyze
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check out trusted default branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download generated files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: host-list-analysis
          path: generated

      - name: Validate artifact boundary
        run: |
          test "$(find generated -type f -printf '%P\n' | sort | paste -sd, -)" = "README.md,state.json"
          test ! -L generated/README.md
          test ! -L generated/state.json
          jq -e '
            type == "object" and
            (.sources | type == "object") and
            (.analysis_count | type == "number") and
            (.skipped_analyses | type == "number") and
            (.last_analysis | type == "string")
          ' generated/state.json >/dev/null
          test "$(grep -c '<!-- STATS_START -->' generated/README.md)" -eq 1
          test "$(grep -c '<!-- STATS_END -->' generated/README.md)" -eq 1
          test "$(stat -c '%s' generated/README.md)" -le 1048576
          test "$(stat -c '%s' generated/state.json)" -le 10485760

      - name: Create or update analysis pull request
        id: update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          branch="automation/host-list-analysis"
          cp generated/README.md README.md
          cp generated/state.json state.json

          if git diff --quiet -- README.md state.json; then
            echo "No generated changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add README.md state.json
          test "$(git diff --cached --name-only | sort | paste -sd, -)" = "README.md,state.json"
          git commit -m "Update host-list analytics [automated]"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch:refs/remotes/origin/$branch"
          fi
          git push --force-with-lease origin "HEAD:$branch"

          if gh pr view "$branch" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh pr edit "$branch" --repo "$REPOSITORY" \
              --title "Update host-list analytics" \
              --body "Automated weekly host-list analytics and state update."
          else
            gh pr create --repo "$REPOSITORY" \
              --base main \
              --head "$branch" \
              --title "Update host-list analytics" \
              --body "Automated weekly host-list analytics and state update."
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Start required PR CI
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.update.outputs.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # GITHUB_TOKEN-created PR events are recorded as action_required to
          # prevent recursive workflow execution. Rerunning that exact run is
          # safe here: this trusted job has already constrained the PR to the
          # two generated files, and the rerun becomes the required PR check.
          for attempt in $(seq 1 15); do
            run_id=$(gh api \
              "repos/$REPOSITORY/actions/workflows/ci.yml/runs?branch=automation%2Fhost-list-analysis&event=pull_request&per_page=20" \
              --jq ".workflow_runs[] | select(.head_sha == \"$HEAD_SHA\" and .conclusion == \"action_required\") | .id" \
              | head -n 1)
            if [ -n "$run_id" ]; then
              gh run rerun "$run_id" --repo "$REPOSITORY"
              exit 0
            fi
            sleep 2
          done
          echo "Required pull_request CI run was not created" >&2
          exit 1
