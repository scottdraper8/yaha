name: Analyze Host Lists

on:
  schedule:
    # Weekly on Sunday at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'blocklists.json'
      - 'whitelist.txt'
      - 'src/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/analyze-host-lists.yml'

concurrency:
  group: host-list-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install project
        run: uv sync --locked

      - name: Run host-list analysis
        run: uv run --frozen yaha --force

      - name: Commit analytics and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md state.json
          if git diff --cached --quiet; then
            echo "No analytics changes to commit"
            exit 0
          fi
          git commit -m "Update host-list analytics [automated]"
          git push

      - name: Generate workflow summary
        if: always()
        run: |
          echo "## YAHA Host-List Analysis" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Configured sources | $(jq 'length' blocklists.json) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Completed analyses | $(jq -r '.analysis_count' state.json) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Removal candidates | $(jq '[.sources[].metadata.removal_candidate | select(. == true)] | length' state.json) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Last analysis | $(jq -r '.last_analysis' state.json) |" >> "$GITHUB_STEP_SUMMARY"
