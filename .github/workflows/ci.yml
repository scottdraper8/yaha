name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          python-version: "3.11.15"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Run pre-commit checks
        run: uv run pre-commit run --all-files

      - name: Lint
        run: uv run ruff check src tests

      - name: Check formatting
        run: uv run ruff format --check src tests

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest

      - name: Audit locked Python dependencies
        run: |
          audit_file="$RUNNER_TEMP/host-judge-audit-requirements.txt"
          uv export --locked --all-groups --no-emit-project \
            --format requirements.txt --output-file "$audit_file" >/dev/null
          uv run --group audit pip-audit \
            --requirement "$audit_file" \
            --require-hashes \
            --disable-pip \
            --strict
